name: Deploy Development

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build development frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter 00sfrontend lint

      - name: Run API security regression tests
        run: pnpm --filter backend test:security

      - name: Run workspace tests
        run: pnpm test

      - name: Build cloud-development frontend
        run: pnpm --filter 00sfrontend build:cloud-development

      - name: Verify development artifact has no private-network API origin
        run: pnpm --filter 00sfrontend assert:production-api-origin

      - name: Upload validated development frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-development
          path: packages/frontend/dist
          if-no-files-found: error
          retention-days: 7

  migrate-development-database:
    name: Migrate Development D1
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply development D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir packages/backend run db:migrate:development

  deploy-development-backend:
    name: Deploy Development Backend
    needs: migrate-development-database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy isolated development backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir packages/backend run deploy:development

  deploy-development-frontend:
    name: Deploy Development Frontend
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download validated development frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-development
          path: packages/frontend/dist

      - name: Verify validated development frontend artifact
        run: |
          test -f packages/frontend/dist/index.html || {
            echo 'Validated development artifact is missing packages/frontend/dist/index.html.' >&2
            exit 1
          }

      - name: Deploy isolated development frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir packages/frontend exec wrangler deploy --env development

  development-smoke:
    name: Smoke Test Development Environment
    needs:
      - deploy-development-backend
      - deploy-development-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify development frontend and backend
        run: |
          sleep 5
          curl --fail --silent --show-error --retry 3 --retry-delay 3 https://2000sme-development.cavazzanileonardo.workers.dev/ | grep -q 'id="root"'
          curl --fail --silent --show-error --retry 3 --retry-delay 3 https://00sbackedn-development.cavazzanileonardo.workers.dev/api/health | grep -qx 'ok'

      # A reachable root and a healthy backend previously passed while My Machine
      # was broken: the frontend was calling an /api route its own Worker does
      # not serve. These assertions cover the contract the application depends on.
      - name: Verify the project catalog the desktop actually calls
        run: |
          catalog="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            -H 'Accept: application/json' \
            https://00sbackedn-development.cavazzanileonardo.workers.dev/api/projects)"
          echo "$catalog" | jq -e 'has("projects") and (.projects | type == "array")' > /dev/null
          echo "$catalog" | jq -e '(.projects | length) as $project_count | [.projects[]? | select((.slug|type=="string") and (.name|type=="string") and (.year|type=="number"))] | length == $project_count' > /dev/null
          echo "Catalog exposes $(echo "$catalog" | jq '.projects | length') project(s)."
          # The retired placeholders must never reappear in a published catalog.
          if echo "$catalog" | jq -e '[.projects[]?.slug] | any(. == "project-alpha" or . == "project-beta")' > /dev/null; then
            echo "::error::Retired placeholder projects are published in the development catalog."
            exit 1
          fi

      - name: Verify the deployed frontend targets the backend origin
        run: |
          # The bundle must carry an absolute backend origin. A same-origin
          # /api path silently degrades to the offline fallback once deployed.
          bundle_url="https://2000sme-development.cavazzanileonardo.workers.dev$(
            curl --fail --silent --show-error https://2000sme-development.cavazzanileonardo.workers.dev/ \
              | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1
          )"
          curl --fail --silent --show-error "$bundle_url" \
            | grep -q '00sbackedn-development\.cavazzanileonardo\.workers\.dev' \
            || { echo "::error::Development bundle does not reference the development backend origin."; exit 1; }

  development-evidence:
    name: Publish Development Evidence
    needs: development-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out development source
        uses: actions/checkout@v4

      - name: Generate development evidence
        env:
          PUBLIC_FRONTEND_URL: https://2000sme-development.cavazzanileonardo.workers.dev
          PUBLIC_BACKEND_URL: https://00sbackedn-development.cavazzanileonardo.workers.dev
          RELEASE_EVIDENCE_DIR: development-evidence
        run: node scripts/generate-release-evidence.mjs

      - name: Publish development-evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-evidence
          path: development-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Add development evidence to workflow summary
        run: cat development-evidence/release-summary.md >> "$GITHUB_STEP_SUMMARY"
