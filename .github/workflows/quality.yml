name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter 00sfrontend lint

      - name: Run API security regression tests
        run: pnpm --filter backend test:security

      - name: Run workspace tests
        run: pnpm test

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./packages/frontend/node_modules/@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium for accessibility tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter 00sfrontend exec playwright install chromium

      - name: Run browser accessibility tests
        run: pnpm --filter 00sfrontend test:a11y

      - name: Build frontend
        run: pnpm --filter 00sfrontend build

      - name: Verify production API origin safety
        run: pnpm --filter 00sfrontend assert:production-api-origin
